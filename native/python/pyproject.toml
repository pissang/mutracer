[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mutracer"
version = "0.1.0"
description = "Author and render MuTracer video shots from Python"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
numpy = ["numpy"]

[tool.setuptools]
packages = ["mutracer"]

[tool.setuptools.package-data]
mutracer = ["bin/*"]
