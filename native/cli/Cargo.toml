[package]
name = "mutracer-cli"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "mutracer"
path = "src/main.rs"

[dependencies]
clap = { version = "=4.6.1", default-features = false, features = ["std", "help", "usage", "error-context", "derive"] }
glam = "=0.30.9"
image = { version = "=0.25.8", default-features = false, features = ["png", "jpeg", "hdr", "webp"] }
mutracer-native = { path = "../host" }
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
sha2 = "0.10"
tempfile = "=3.27.0"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "=0.6.5"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSDictionary", "NSError", "NSValue", "NSObject", "NSString", "NSURL"] }
