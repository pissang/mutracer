[package]
name = "mutracer-viewer"
version = "0.0.0"
edition = "2024"
publish = false

[features]
hot-reload = ["dep:subsecond", "dep:dioxus-devtools"]
dlss-rr = ["dep:ash", "dep:libloading"]

[dependencies]
subsecond = { version = "=0.7.10", optional = true }
dioxus-devtools = { version = "=0.7.10", optional = true }
percent-encoding = "2"
url = "2"
mutracer-native = { path = "../host", features = ["viewer-support"] }
anyhow = "1"
pollster = "=0.4.0"
eframe = { version = "=0.36.0", default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland"] }
glam = "=0.30.9"
image = { version = "=0.25.8", default-features = false, features = ["png", "jpeg", "hdr", "webp", "exr"] }
rfd = "=0.15.4"

serde_json = "1"
ureq = { version = "=3.4.2", default-features = false, features = ["rustls"] }

wgpu = { version = "=30.0.1", default-features = false, features = ["std", "wgsl"] }

[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { version = "=30.0.1", default-features = false, features = ["metal"] }

[target.'cfg(target_os = "windows")'.dependencies]
ash = { version = "=0.38.0", default-features = false, features = ["std", "loaded"], optional = true }
libloading = { version = "=0.8.9", optional = true }
wgpu = { version = "=30.0.1", default-features = false, features = ["dx12", "vulkan"] }

[target.'cfg(target_os = "linux")'.dependencies]
wgpu = { version = "=30.0.1", default-features = false, features = ["vulkan"] }

[dev-dependencies]
naga = { version = "=30.0.1", features = ["spv-out"] }
base64 = "0.22"
gltf = { version = "=1.4.1", features = ["KHR_materials_ior", "KHR_materials_transmission", "KHR_materials_emissive_strength", "KHR_materials_unlit", "KHR_texture_transform", "extensions"] }
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06", "x11", "wayland"] }

# dx uses this profile. Keep viewer patches quick without slowing SDK work.
[profile.desktop-dev]
inherits = "dev"
opt-level = 0
debug = 1

[profile.desktop-dev.package."*"]
opt-level = 2
